name: nha-minh-utilities

x-backend-environment: &backend_env
  DATABASE_URL: postgresql+psycopg://utility:${POSTGRES_PASSWORD:-utility_local_dev}@postgres:5432/utility
  KNOWLEDGE_DATABASE_URL: postgresql+psycopg://knowledge:${KNOWLEDGE_POSTGRES_PASSWORD:-knowledge_local_dev}@knowledge-postgres:5432/knowledge
  JWT_SECRET: ${JWT_SECRET:-}
  APP_ENV: development
  BOOTSTRAP_FIRST_USER_ADMIN: "true"
  LLM_PROVIDER: gemini
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  GEMINI_SEARCH_ENABLED: ${GEMINI_SEARCH_ENABLED:-false}
  GEMINI_REPLY_TOKENS: ${GEMINI_REPLY_TOKENS:-2048}
  GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-25}
  GEMINI_QUOTA_GUARD_ENABLED: "true"
  GEMINI_REQUESTS_PER_MINUTE: ${GEMINI_REQUESTS_PER_MINUTE:-12}
  KNOWLEDGE_RAG_ENABLED: "true"
  KNOWLEDGE_EMBEDDING_MODEL: gemini-embedding-2
  KNOWLEDGE_ARCHIVE_PATH: /data/knowledge
  FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
  TZ: Asia/Ho_Chi_Minh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: utility
      POSTGRES_USER: utility
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-utility_local_dev}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5434}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utility -d utility"]
      interval: 5s
      timeout: 5s
      retries: 20

  knowledge-postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${KNOWLEDGE_POSTGRES_PASSWORD:-knowledge_local_dev}
    ports: ["127.0.0.1:${KNOWLEDGE_POSTGRES_PORT:-5435}:5432"]
    volumes: ["knowledge_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend_env
    command: ["python", "-m", "app.container_start", "serve"]
    volumes:
      - runtime_data:/app/runtime
      - knowledge_archive:/data/knowledge
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      knowledge-postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  scheduler:
    build: ./backend
    restart: unless-stopped
    environment: *backend_env
    command: ["python", "-m", "app.container_start", "scheduler"]
    volumes:
      - runtime_data:/app/runtime
      - knowledge_archive:/data/knowledge
    depends_on:
      backend: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        INTERNAL_API_URL: http://backend:8000
    restart: unless-stopped
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-LocalPgAdmin2026!}
      PGADMIN_DISABLE_POSTFIX: "1"
    ports: ["127.0.0.1:${PGADMIN_PORT:-5050}:80"]
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./deploy/pgadmin.servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres: {condition: service_healthy}
      knowledge-postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/misc/ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres_data:
  knowledge_data:
  knowledge_archive:
  runtime_data:
  pgadmin_data:
